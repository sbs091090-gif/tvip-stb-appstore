services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: appstore
      POSTGRES_USER: appstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U appstore -d appstore']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      secrets: [proxy_ca]
    image: tvip-appstore:dev
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - media:/data/media
      - static:/data/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
  nginx:
    image: nginx:1.28.0-bookworm
    ports: ['${HTTP_BIND:-127.0.0.1}:8080:80']
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/data/media:ro
      - static:/data/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  media:
  static:
secrets:
  proxy_ca:
    file: ${BUILD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
